name: Backend

'on':
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '!backend/README.md'
      - 'pipeline/backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '!backend/README.md'
      - 'pipeline/backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish backend
        shell: pwsh
        run: ./pipeline/backend/Build.ps1
      - name: Check deployment configuration
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          DEPLOY_CLIENT_ID: ${{ vars.ROLLPAY_BACKEND_DEPLOY_CLIENT_ID }}
          TENANT_ID: ${{ vars.ROLLPAY_AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.ROLLPAY_AZURE_SUBSCRIPTION_ID }}
          FUNCTION_APP_NAME: ${{ vars.ROLLPAY_FUNCTION_APP_NAME }}
        run: |
          foreach ($name in 'DEPLOY_CLIENT_ID','TENANT_ID','SUBSCRIPTION_ID','FUNCTION_APP_NAME') {
            if (![Environment]::GetEnvironmentVariable($name)) { throw "Missing repository deployment variable: $name. See pipeline/README.md." }
          }
      - name: Azure login with OIDC
        if: github.event_name != 'pull_request'
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.ROLLPAY_BACKEND_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.ROLLPAY_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.ROLLPAY_AZURE_SUBSCRIPTION_ID }}
      - name: Deploy backend to Flex Consumption
        if: github.event_name != 'pull_request'
        uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1
        with:
          app-name: ${{ vars.ROLLPAY_FUNCTION_APP_NAME }}
          package: backend/bin/ci-publish
          remote-build: false

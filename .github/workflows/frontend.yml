name: Frontend

'on':
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '!frontend/README.md'
      - 'pipeline/frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '!frontend/README.md'
      - 'pipeline/frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install, test and build frontend
        shell: pwsh
        env:
          VITE_APP_MODE: ${{ vars.VITE_APP_MODE || 'demo' }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_ENTRA_TENANT_ID: ${{ vars.VITE_ENTRA_TENANT_ID }}
          VITE_ENTRA_SPA_CLIENT_ID: ${{ vars.VITE_ENTRA_SPA_CLIENT_ID }}
          VITE_ENTRA_API_SCOPE: ${{ vars.VITE_ENTRA_API_SCOPE }}
        run: ./pipeline/frontend/Build.ps1
      - name: Check deployment secret
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$DEPLOYMENT_TOKEN" ]; then
            echo '::error::Set the repository secret AZURE_STATIC_WEB_APPS_API_TOKEN for swa-rollpay-prod.'
            exit 1
          fi
      - name: Deploy frontend to production
        if: github.event_name != 'pull_request'
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend/dist
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          production_branch: main
